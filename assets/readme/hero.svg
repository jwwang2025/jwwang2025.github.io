<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Startint.log - AI Infra & Systems 技术博客">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7DD3FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)"/>

  <!-- 网格装饰（淡） -->
  <g opacity="0.15" stroke="#1E293B" stroke-width="0.5">
    <line x1="80" y1="60" x2="80" y2="360"/>
    <line x1="160" y1="60" x2="160" y2="360"/>
    <line x1="240" y1="60" x2="240" y2="360"/>
    <line x1="320" y1="60" x2="320" y2="360"/>
    <line x1="400" y1="60" x2="400" y2="360"/>
    <line x1="480" y1="60" x2="480" y2="360"/>
    <line x1="80" y1="90" x2="480" y2="90"/>
    <line x1="80" y1="150" x2="480" y2="150"/>
    <line x1="80" y1="210" x2="480" y2="210"/>
    <line x1="80" y1="270" x2="480" y2="270"/>
    <line x1="80" y1="330" x2="480" y2="330"/>
  </g>

  <!-- 左侧：知识图谱节点装饰 -->
  <g transform="translate(720, 60)">
    <!-- 中心节点 -->
    <circle cx="220" cy="150" r="28" fill="#1E293B" filter="url(#softShadow)"/>
    <circle cx="220" cy="150" r="14" fill="#7DD3FC"/>

    <!-- 周围节点 -->
    <circle cx="100" cy="80" r="16" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="340" cy="80" r="16" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="60" cy="200" r="14" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="380" cy="200" r="14" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="120" cy="280" r="18" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="320" cy="280" r="12" fill="white" stroke="#1E293B" stroke-width="2"/>
    <circle cx="220" cy="40" r="10" fill="#7DD3FC"/>
    <circle cx="220" cy="260" r="10" fill="#7DD3FC"/>

    <!-- 连接线 -->
    <g stroke="#7DD3FC" stroke-width="2" opacity="0.6">
      <line x1="220" y1="150" x2="100" y2="80"/>
      <line x1="220" y1="150" x2="340" y2="80"/>
      <line x1="220" y1="150" x2="60" y2="200"/>
      <line x1="220" y1="150" x2="380" y2="200"/>
      <line x1="220" y1="150" x2="120" y2="280"/>
      <line x1="220" y1="150" x2="320" y2="280"/>
      <line x1="220" y1="150" x2="220" y2="40"/>
      <line x1="220" y1="150" x2="220" y2="260"/>
      <line x1="100" y1="80" x2="60" y2="200"/>
      <line x1="340" y1="80" x2="380" y2="200"/>
      <line x1="60" y1="200" x2="120" y2="280"/>
      <line x1="380" y1="200" x2="320" y2="280"/>
    </g>

    <!-- 数据流小点 -->
    <circle cx="160" cy="115" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="115" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="215" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="215" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 左侧文字区域 -->
  <g transform="translate(80, 110)">
    <!-- Logo 标识（简化版 S） -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#1E293B"/>
      <path d="M 14 16 C 14 8 28 8 34 14 C 38 18 38 24 34 28 C 30 32 24 32 20 34" 
            stroke="#7DD3FC" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 22 38 C 26 40 32 40 36 44 C 42 48 42 56 42 48 C 42 40 28 40 28 32" 
            stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
      <circle cx="28" cy="28" r="3" fill="#7DD3FC"/>
    </g>

    <!-- 主标题 -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
          font-size="42" font-weight="700" fill="#1E293B">
      Startint.log
    </text>

    <!-- 副标题 -->
    <text x="76" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
          font-size="18" font-weight="500" fill="#64748B">
      AI Infra &amp; Systems — 个人技术博客
    </text>
  </g>

  <!-- 描述文字 -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
          font-size="16" fill="#475569">
      记录 AI 基础设施、Agent 架构、RAG 系统
    </text>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
          font-size="16" fill="#475569">
      知识图谱与系统设计的技术笔记
    </text>
  </g>

  <!-- 标签徽章 -->
  <g transform="translate(80, 290)">
    <g>
      <rect x="0" y="0" width="92" height="32" rx="16" fill="white" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" font-weight="500" fill="#0369A1" text-anchor="middle">
        Astro 4
      </text>
    </g>
    <g transform="translate(104, 0)">
      <rect x="0" y="0" width="108" height="32" rx="16" fill="white" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="54" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" font-weight="500" fill="#0369A1" text-anchor="middle">
        TypeScript
      </text>
    </g>
    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="white" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="60" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" font-weight="500" fill="#0369A1" text-anchor="middle">
        Tailwind CSS 4
      </text>
    </g>
    <g transform="translate(356, 0)">
      <rect x="0" y="0" width="112" height="32" rx="16" fill="#1E293B"/>
      <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" font-weight="500" fill="#7DD3FC" text-anchor="middle">
        GitHub Pages
      </text>
    </g>
  </g>

  <!-- 底部链接区域 -->
  <g transform="translate(80, 360)">
    <a href="https://jwwang2025.github.io" style="cursor: pointer;">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="#1E293B"/>
      <text x="60" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="14" font-weight="600" fill="white" text-anchor="middle">
        访问博客 →
      </text>
    </a>
    <a href="https://jwwang2025.github.io/posts" style="cursor: pointer;">
      <rect x="136" y="0" width="100" height="40" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="186" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="14" font-weight="500" fill="#475569" text-anchor="middle">
        文章库
      </text>
    </a>
    <a href="https://jwwang2025.github.io/tags" style="cursor: pointer;">
      <rect x="252" y="0" width="84" height="40" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="294" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="14" font-weight="500" fill="#475569" text-anchor="middle">
        主题索引
      </text>
    </a>
  </g>
</svg>
