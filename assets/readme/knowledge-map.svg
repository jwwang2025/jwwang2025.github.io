<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="知识地图 - 四大技术领域">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="340" rx="16" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="600" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
        font-size="22" font-weight="700" fill="#1E293B" text-anchor="middle">
    🗺️ 知识地图
  </text>
  <text x="600" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
        font-size="14" fill="#64748B" text-anchor="middle">
    四大核心技术领域，构建系统化的 AI 知识体系
  </text>

  <!-- 四个知识领域卡片 -->
  <g transform="translate(40, 110)">
    <!-- AI Infrastructure -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="265" height="180" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="5" rx="2.5" fill="#7DD3FC"/>
      
      <!-- 图标：服务器/基础设施 -->
      <g transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#F0F9FF"/>
        <rect x="8" y="8" width="24" height="8" rx="2" fill="#1E293B"/>
        <rect x="8" y="20" width="24" height="8" rx="2" fill="#1E293B"/>
        <circle cx="30" cy="12" r="2" fill="#7DD3FC"/>
        <circle cx="30" cy="24" r="2" fill="#7DD3FC"/>
      </g>
      
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="17" font-weight="700" fill="#1E293B">
        AI Infrastructure
      </text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        GPU 集群 · 分布式训练 · K8s 部署
      </text>
      <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        MLOps 实践 · 推理服务
      </text>
      
      <!-- 标签 -->
      <g transform="translate(24, 156)">
        <rect x="0" y="0" width="52" height="18" rx="9" fill="#F0F9FF"/>
        <text x="26" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
              font-size="10" font-weight="500" fill="#0369A1" text-anchor="middle">
          ai-infra
        </text>
      </g>
    </g>

    <!-- Knowledge Graph -->
    <g transform="translate(290, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="265" height="180" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="5" rx="2.5" fill="#A78BFA"/>
      
      <!-- 图标：图谱节点 -->
      <g transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#F5F3FF"/>
        <circle cx="20" cy="12" r="5" fill="#8B5CF6"/>
        <circle cx="10" cy="30" r="4" fill="#C4B5FD"/>
        <circle cx="30" cy="30" r="4" fill="#C4B5FD"/>
        <line x1="20" y1="17" x2="10" y2="26" stroke="#8B5CF6" stroke-width="1.5"/>
        <line x1="20" y1="17" x2="30" y2="26" stroke="#8B5CF6" stroke-width="1.5"/>
        <line x1="14" y1="30" x2="26" y2="30" stroke="#C4B5FD" stroke-width="1.5"/>
      </g>
      
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="17" font-weight="700" fill="#1E293B">
        Knowledge Graph
      </text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        图神经网络 · RAG 检索增强
      </text>
      <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        知识表示学习 · 实体抽取
      </text>
      
      <g transform="translate(24, 156)">
        <rect x="0" y="0" width="88" height="18" rx="9" fill="#F5F3FF"/>
        <text x="44" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
              font-size="10" font-weight="500" fill="#7C3AED" text-anchor="middle">
          knowledge-graph
        </text>
      </g>
    </g>

    <!-- RAG System -->
    <g transform="translate(580, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="265" height="180" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="5" rx="2.5" fill="#34D399"/>
      
      <!-- 图标：检索/搜索 -->
      <g transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#ECFDF5"/>
        <circle cx="17" cy="17" r="8" stroke="#059669" stroke-width="2" fill="none"/>
        <line x1="23" y1="23" x2="30" y2="30" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="11" y="14" width="12" height="1" fill="#059669"/>
        <rect x="11" y="18" width="8" height="1" fill="#059669"/>
      </g>
      
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="17" font-weight="700" fill="#1E293B">
        RAG System
      </text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        向量数据库 · 检索策略
      </text>
      <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        上下文管理 · 评估优化
      </text>
      
      <g transform="translate(24, 156)">
        <rect x="0" y="0" width="38" height="18" rx="9" fill="#ECFDF5"/>
        <text x="19" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
              font-size="10" font-weight="500" fill="#047857" text-anchor="middle">
          rag
        </text>
      </g>
    </g>

    <!-- System Design -->
    <g transform="translate(870, 0)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="265" height="180" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="265" height="5" rx="2.5" fill="#FBBF24"/>
      
      <!-- 图标：系统/架构 -->
      <g transform="translate(24, 28)">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#FFFBEB"/>
        <rect x="6" y="8" width="12" height="10" rx="2" fill="#F59E0B"/>
        <rect x="22" y="8" width="12" height="10" rx="2" fill="#FCD34D"/>
        <rect x="14" y="22" width="12" height="10" rx="2" fill="#F59E0B"/>
        <line x1="12" y1="18" x2="20" y2="22" stroke="#92400E" stroke-width="1"/>
        <line x1="28" y1="18" x2="20" y2="22" stroke="#92400E" stroke-width="1"/>
      </g>
      
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="17" font-weight="700" fill="#1E293B">
        System Design
      </text>
      <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        高可用架构 · 性能优化
      </text>
      <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
            font-size="13" fill="#64748B">
        微服务 · 云原生
      </text>
      
      <g transform="translate(24, 156)">
        <rect x="0" y="0" width="92" height="18" rx="9" fill="#FFFBEB"/>
        <text x="46" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" 
              font-size="10" font-weight="500" fill="#B45309" text-anchor="middle">
          system-design
        </text>
      </g>
    </g>
  </g>

  <!-- 连接线（卡片之间的关系暗示） -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5">
    <line x1="305" y1="200" x2="330" y2="200"/>
    <line x1="595" y1="200" x2="620" y2="200"/>
    <line x1="885" y1="200" x2="910" y2="200"/>
  </g>
</svg>
