            font-size="12" fill="#94A3B8">
        2026-08-24 · 60 min
      </text>
    </g>
    
    <!-- 箭头 -->
    <g transform="translate(340, 160)">
      <circle cx="0" cy="0" r="16" fill="#F1F5F9"/>
      <path d="M-5 -4 L3 0 L-5 4" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 文章卡片 2 -->
