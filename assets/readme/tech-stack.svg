<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" role="img" aria-label="技术栈">
  <defs>
    <filter id="techShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 技术栈图标行 -->
  <g transform="translate(0, 30)">
    <!-- Astro -->
    <g transform="translate(40, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="120" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#FF5D01" opacity="0.1"/>
        <path d="M14 4 L24 24 L14 20 L4 24 Z" fill="#FF5D01"/>
      </g>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        Astro 4
      </text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(180, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="140" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#3178C6"/>
        <text x="14" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TS</text>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        TypeScript
      </text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(340, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="160" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="0" width="28" height="28" rx="6" fill="#06B6D4" opacity="0.15"/>
        <path d="M7 14 Q14 7 21 14 Q14 21 7 14" fill="#06B6D4" stroke="none"/>
        <path d="M10 14 Q14 10 18 14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        Tailwind CSS 4
      </text>
    </g>

    <!-- Content Collections -->
    <g transform="translate(520, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="180" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="2" width="28" height="24" rx="3" fill="#1E293B"/>
        <rect x="4" y="8" width="20" height="2" rx="1" fill="#7DD3FC"/>
        <rect x="4" y="13" width="14" height="2" rx="1" fill="#94A3B8"/>
        <rect x="4" y="18" width="17" height="2" rx="1" fill="#94A3B8"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="14" font-weight="600" fill="#1E293B">
        Content Collections
      </text>
    </g>

    <!-- MDX -->
    <g transform="translate(720, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="100" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#FCB322" opacity="0.15"/>
        <text x="14" y="19" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#FCB322" text-anchor="middle">M↓</text>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        MDX
      </text>
    </g>

    <!-- KaTeX -->
    <g transform="translate(840, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="110" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#2F6DB3" opacity="0.12"/>
        <text x="14" y="20" font-family="Times New Roman, serif" font-size="16" font-weight="bold" fill="#2F6DB3" text-anchor="middle">∑</text>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        KaTeX
      </text>
    </g>

    <!-- Shiki -->
    <g transform="translate(970, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="110" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <rect x="0" y="0" width="28" height="28" rx="4" fill="#8B5CF6" opacity="0.12"/>
        <path d="M6 20 L12 14 L8 14 L14 8 L10 8 L16 2 L22 8 L18 8 L24 14 L20 14 L26 20" 
              stroke="#8B5CF6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        Shiki
      </text>
    </g>
  </g>

  <!-- 第二行 -->
  <g transform="translate(0, 106)">
    <!-- GitHub Actions -->
    <g transform="translate(40, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="170" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#24292E" opacity="0.08"/>
        <circle cx="14" cy="12" r="6" fill="#24292E"/>
        <path d="M8 18 Q14 22 20 18" stroke="#24292E" stroke-width="1.5" fill="none"/>
        <rect x="12" y="19" width="4" height="3" rx="0.5" fill="#24292E"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="14" font-weight="600" fill="#1E293B">
        GitHub Actions
      </text>
    </g>

    <!-- GitHub Pages -->
    <g transform="translate(230, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="160" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#2278FF" opacity="0.1"/>
        <circle cx="14" cy="14" r="8" stroke="#2278FF" stroke-width="2" fill="none"/>
        <ellipse cx="14" cy="14" rx="12" ry="4" stroke="#2278FF" stroke-width="1.5" fill="none"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="14" font-weight="600" fill="#1E293B">
        GitHub Pages
      </text>
    </g>

    <!-- Node.js -->
    <g transform="translate(410, 0)" filter="url(#techShadow)">
      <rect x="0" y="0" width="120" height="56" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#339933" opacity="0.1"/>
        <path d="M14 5 L22 10 L22 18 L14 23 L6 18 L6 10 Z" fill="#339933" opacity="0.8"/>
      </g>
      <text x="56" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="15" font-weight="600" fill="#1E293B">
        Node.js 22
      </text>
    </g>
  </g>
</svg>
