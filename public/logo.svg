<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style type="text/css">
      .charcoal { fill: #1E293B; }
      .accent { fill: #7DD3FC; }
      .charcoal-stroke { stroke: #1E293B; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent-stroke { stroke: #7DD3FC; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 圆角正方形底色填充 -->
  <rect x="48" y="48" width="416" height="416" rx="96" ry="96" fill="#F0F9FF"/>
  <!-- 圆角正方形外边框 -->
  <rect x="48" y="48" width="416" height="416" rx="96" ry="96" class="charcoal-stroke" style="stroke-width: 6;"/>

  <!-- 抽象S形几何标识 - 主体 -->
  <g transform="translate(256, 256)">
    <!-- 上半圆弧（炭黑） -->
    <path d="M -70 -70 
             C -70 -130 20 -130 50 -95
             C 65 -78 65 -58 50 -42
             C 40 -32 25 -28 12 -24" 
          class="charcoal-stroke" style="stroke-width: 10;"/>
    
    <!-- 下半圆弧（青色点缀） -->
    <path d="M -12 24
             C -25 28 -40 32 -50 42
             C -65 58 -65 78 -50 95
             C -20 130 70 130 70 70" 
          class="accent-stroke" style="stroke-width: 10;"/>
    
    <!-- 中心圆点 -->
    <circle cx="0" cy="0" r="10" class="accent"/>
    
    <!-- 装饰小点 -->
    <circle cx="-85" cy="0" r="6" class="charcoal"/>
    <circle cx="85" cy="0" r="6" class="charcoal"/>
  </g>

</svg>
